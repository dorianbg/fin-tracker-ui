[project]
name = "fin-tracker"
version = "0.1.0"
description = "Financial instrument tracker — data pipeline + Streamlit dashboard"
authors = [{ name = "Dorian Beganovic" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # UI
    "streamlit>=1.57.0",
    "matplotlib",
    "skfolio",
    "riskfolio-lib>=6.3.1,<7",
    "seaborn>=0.13.2,<0.14",
    "fitz>=0.0.1.dev2",
    "frontend>=0.0.3",
    "pymupdf>=1.26.5",
    "opencv-python>=4.12.0.88",
    "pillow>=11.3.0",
    "camelot-py",
    "polars>=1.38.1",
    # Pipeline
    "yfinance>=0.2.31,<0.3",
    "sqlalchemy>=2.0.25,<3",
    "psycopg2-binary>=2.9.9,<3",
    "pypdf2>=3.0.1,<4",
    # Shared
    "duckdb",
    "pandas>=3.0.0,<4",
    "numpy",
    "fear-and-greed>=0.4",
    "ib-insync>=0.9.86,<0.10",
]

[dependency-groups]
dev = [
    "watchdog>=4.0.0,<5",
    "ruff",
    "pytest>=9.0.3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
